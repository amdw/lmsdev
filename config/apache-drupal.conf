<VirtualHost *:80>
    DocumentRoot /var/www/html

    Alias /lmsdev /var/www/html/drupal10/web

    RedirectMatch ^/$ /lmsdev/

    <Directory /var/www/html>
        Options None
        AllowOverride None
        Require all denied
    </Directory>

    <Directory /var/www/html/drupal10/web>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
